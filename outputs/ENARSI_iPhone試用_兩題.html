Ggj9kyH1YGVNcphtCNv8qPcQRceo6w6yH9iLRMKGtBW5ievIwaXJyCa2UXRxPtyllvFh6SEQIuRfYIQZ5UlQtKr1LWXY4QMVn6+52mYjrkKow14qa/9uxcW/uYiCuGGpdkpyZUo8+KScySo9FShRtOn6MOQji4GG9640FvppZcrYU7IOO8FvlVqJVTLEhPvo8UI1k19m3wTEHK30YWsb0evgHFvxaO5/XHVsBMoL2XevWAaEVtx87NkEPNWXnta0UbKty6vsS/SsS2tYozExI2oVzdgb6X2guviotlgGTCPvlQv8vo6wbF0DycSjgdtBgDCXMSllNb0La31WncZzjdTZkwzlK8qMbswLwA5ISprIIAF5g2uVCgsOsiuVRYTL02a6jnqnzqkG8xyUY6ad749Qu0nawAAAAAAAA=="],"options":[],"answer":[],"stem":"Drag and drop the operations from the left onto the locations where the operations are performed on the\nright.","chapter":"B01"}],"notes":{"A1":{"id":"A1","stemZh":"請參考圖示。某 IT 人員在上班時間進到公司後無法透過 SSH 存取裝置。應採取哪一項動作解決此問題？","optionsZh":{"A":"修改 access list，使用正確的 IP 位址","B":"設定正確的 time-range","C":"修改 access list 以更正 subnet mask","D":"將 access list 套用在 outbound 方向"},"html":"\u003cdiv>\u003cdiv>\n\u003cp>\u003ch3>題目核心\u003c/h3>\u003c/p>\n\u003cp>上班時間卻連不進 SSH。圖上 access-list 101 的來源寫成 \u003ccode>10.0.0.0 0.0.0.0\u003c/code>——wildcard 0.0.0.0 代表「只精準比對 10.0.0.0 這一台」，IT 人員實際坐在 10.1.1.x 網段，根本不在放行名單裡。time-range Office-hour（平日 08:00–17:00）在上班時段是生效的，不是時間問題；ACL 也確實掛在 Ethernet0/0 的 in 方向。真正的病灶是來源位址寫錯，把來源改成涵蓋 IT 人員實際網段（例如 \u003ccode>10.1.1.0 0.0.0.255\u003c/code>）就通。故選 A。\u003c/p>\n\u003chr>\n\u003cp>\u003ch3>名詞解釋\u003c/h3>\u003c/p>\n\u003cul>\n\u003cli>\u003cb>ACL（Access Control List，存取控制清單）\u003c/b>：依來源/目的 IP、協定、埠號逐行比對封包的過濾清單；由上往下第一條命中即停止，末尾隱含 deny any。\u003c/li>\n\u003cli>\u003cb>Wildcard Mask（萬用遮罩）\u003c/b>：ACL 比對位址用的反遮罩，0 表示「必須相符」、1 表示「不管」。0.0.0.0 = 整段位址都要精準相符（單一主機）；0.0.0.255 = 最後 8 bits 隨意（一整個 /24）。\u003c/li>\n\u003cli>\u003cb>time-range（時間範圍）\u003c/b>：讓 ACL entry 只在指定時段生效的機制；periodic 定義週期性時段，如 weekdays 08:00 to 17:00。\u003c/li>\n\u003cli>\u003cb>SSH（Secure Shell，安全外殼協定）\u003c/b>：TCP/22，加密的遠端管理協定，取代明文的 Telnet。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>\u003ch3>本題考點說明\u003c/h3>\u003c/p>\n\u003cp>ACL 比對的三個關鍵——方向、時間、位址——這題全擺上檯面當誘答，但只有位址是錯的：\u003c/p>\u003cul>\n\u003cli>\u003cb>方向\u003c/b>：\u003ccode>ip access-group 101 in\u003c/code> 掛在 Ethernet0/0 的 in 方向，IT 人員的 SSH 正是往這個方向進入路由器，正確。\u003c/li>\n\u003cli>\u003cb>時間\u003c/b>：time-range weekdays 08:00–17:00；題幹說「上班時間」進辦公室，命中時段，ACL 生效沒問題。\u003c/li>\n\u003cli>\u003cb>位址\u003c/b>：\u003ccode>permit tcp 10.0.0.0 0.0.0.0 ... eq ssh\u003c/code> 的來源 wildcard 0.0.0.0 只放行 10.0.0.0 單一 IP。IT 人員在 10.1.1.0/24，被末尾隱含 deny 擋掉。把來源改成 \u003ccode>10.1.1.0 0.0.0.255\u003c/code>（或 IT 人員真實 IP）即可放行。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>\u003ch3>本題相關考點觀念比較\u003c/h3>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>寫法\u003c/th>\n\u003cth>涵蓋範圍\u003c/th>\n\u003cth>意義\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>10.0.0.0 0.0.0.0\u003c/code>\u003c/td>\n\u003ctd>10.0.0.0 單一台\u003c/td>\n\u003ctd>本題誤設，只放行一台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>10.1.1.0 0.0.0.255\u003c/code>\u003c/td>\n\u003ctd>10.1.1.0–10.1.1.255\u003c/td>\n\u003ctd>正確：涵蓋 IT 人員 /24\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>any\u003c/code>\u003c/td>\n\u003ctd>所有來源\u003c/td>\n\u003ctd>等同 0.0.0.0 255.255.255.255\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>host 10.1.1.10\u003c/code>\u003c/td>\n\u003ctd>單一主機\u003c/td>\n\u003ctd>等同 10.1.1.10 0.0.0.0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr>\n\u003cp>\u003ch3>各答案選項分析\u003c/h3>\u003c/p>\n\u003col>\n\u003cli>✅ A. 正解。wildcard 0.0.0.0 只涵蓋 10.0.0.0 一台，改成涵蓋 10.1.1.x 網段，IT 人員才進得來。\u003c/li>\n\u003cli>❌ B. time-range 本來就對——上班時間命中 weekdays 08:00–17:00，時段不是問題。\u003c/li>\n\u003cli>❌ C. ACL 用的是 wildcard mask 不是 subnet mask，且問題在來源位址範圍而非遮罩位數；措辭本身就不對題。\u003c/li>\n\u003cli>❌ D. SSH 從內網連進路由器自身屬 inbound，改成 outbound 反而完全擋掉管理流量。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003cp>\u003ch3>本題相關常用指令\u003c/h3>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\u003cth>命令\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>看 ACL 內容與命中數\u003c/td>\n\u003ctd>show access-lists 101\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>看 time-range 狀態\u003c/td>\n\u003ctd>show time-range\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>看介面掛哪張 ACL、哪個方向\u003c/td>\n\u003ctd>show ip interface Ethernet0/0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修正來源位址\u003c/td>\n\u003ctd>ip access-list extended 101\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>放行 IT 網段的 SSH\u003c/td>\n\u003ctd>permit tcp 10.1.1.0 0.0.0.255 172.16.1.0 0.0.0.255 eq 22 time-range Office-hour\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr>\n\u003cp>\u003ch3>考試常見陷阱\u003c/h3>\u003c/p>\n\u003col>\n\u003cli>wildcard 0.0.0.0 = 單一主機，別看成「任意」（任意是 any / 255.255.255.255）。\u003c/li>\n\u003cli>ACL 用 wildcard mask，不是 subnet mask，兩者 0/1 意義相反。\u003c/li>\n\u003cli>time-range 名稱在 ACL entry 與 time-range 定義必須一字不差，拼錯等於沒套。\u003c/li>\n\u003cli>ACL 由上而下第一條命中即停；順序錯會提前 deny/permit。\u003c/li>\n\u003cli>連進路由器自身的 SSH/Telnet 是 inbound，方向別掛反。\u003c/li>\n\u003c/ol>\n\u003c/div>\u003c/div>","source":"BGW 原文（使用者提供的 A1–A100 網頁檔）","imported":"2026-11-05","english":"Refer to the exhibit. An IT staff member comes into the office during normal office hours and cannot access devices through SSH. Which action should be taken to resolve this issue?","sourceFile":"view-source_https___bgw.tw_300-410_A01_1_.html"},"B1":{"id":"B1","stemZh":"請將左側的操作拖曳到右側對應執行該操作的位置。","optionsZh":{},"html":"\u003cdiv>\u003cdiv>\n\u003cp>\u003ch3>題目核心（破題）\u003c/h3>\u003c/p>\n\u003cp>本題為分類型拖圖題，要把 MPLS 標籤轉送相關的操作歸入「LSR（標籤交換路由器）」與「根據標籤」兩類。MPLS 的精神是以「標籤（label）」取代傳統逐跳的目的 IP 查表：封包進入 MPLS 網域時由邊緣路由器（LER）依其所屬的轉送等價類別（FEC）push 上標籤；網域核心的 LSR 只看標籤、查 LFIB 做 swap 並轉送；離開網域前再由出口 LER 或倒數第二跳 LSR pop 掉標籤。判讀本題的關鍵，就是分清各動作屬於「邊緣加/拆標籤」還是「核心依標籤轉送」。\u003c/p>\n\u003chr>\n\u003cp>\u003ch3>名詞解釋\u003c/h3>\u003c/p>\n\u003cul>\n\u003cli>\u003cb>LSR（Label Switch Router，標籤交換路由器）\u003c/b>：MPLS 核心 P 路由器，依封包既有標籤查 LFIB 做 swap 後轉送，不檢視內層 IP 標頭。\u003c/li>\n\u003cli>\u003cb>LER（Label Edge Router，標籤邊緣路由器）\u003c/b>：MPLS 網域邊緣的 PE，入口對未標籤封包 push 標籤、出口 pop 標籤。\u003c/li>\n\u003cli>\u003cb>PHP（Penultimate Hop Popping，倒數第二跳彈出）\u003c/b>：倒數第二台 LSR 先移除最外層標籤，減輕出口 LER 的雙重查表負擔（對應隱含空標籤 label 3）。\u003c/li>\n\u003cli>\u003cb>LFIB（Label Forwarding Information Base，標籤轉送資訊庫）\u003c/b>：標籤轉送表，LSR 依入標籤查出標籤與出介面。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>\u003ch3>本題考點說明\u003c/h3>\u003c/p>\n\u003cp>MPLS 對標籤有三種基本操作：\u003cb>push（imposition，加上標籤）\u003c/b>由入口 LER 對未標籤封包執行；\u003cb>swap（交換標籤）\u003c/b>由網域內每一台 LSR 依 LFIB 執行，把入標籤換成下一段的出標籤；\u003cb>pop（disposition，移除標籤）\u003c/b>由出口 LER、或執行 PHP 的倒數第二跳 LSR 執行。因此「為未標籤封包指派標籤」屬於邊緣 push、「讀取標籤並轉送」「執行 PHP」屬於依標籤轉送的核心行為。MPLS 同時是 L3VPN 的承載基礎，能在同一條核心、以兩層標籤（外層傳輸標籤、內層 VPN 標籤）同時承載多個客戶 VPN 的流量、彼此隔離。\u003c/p>\n\u003chr>\n\u003cp>\u003ch3>本題相關考點觀念比較\u003c/h3>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>標籤操作\u003c/th>\n\u003cth>由誰執行\u003c/th>\n\u003cth>時機\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>push（加上標籤）\u003c/td>\n\u003ctd>入口 LER / PE\u003c/td>\n\u003ctd>封包進入 MPLS 網域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>swap（交換標籤）\u003c/td>\n\u003ctd>核心 LSR / P\u003c/td>\n\u003ctd>網域內每一跳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>pop（移除標籤）\u003c/td>\n\u003ctd>出口 LER 或倒數第二跳 LSR（PHP）\u003c/td>\n\u003ctd>封包離開 MPLS 網域前\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr>\n\u003cp>\u003ch3>配對分析\u003c/h3>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>左側項目\u003c/th>\n\u003cth>對應右側\u003c/th>\n\u003cth>說明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>LSR（標籤交換路由器）\u003c/td>\n\u003ctd>讀取標籤並轉送封包\u003c/td>\n\u003ctd>LSR 查 LFIB、swap 後轉送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LSR（標籤交換路由器）\u003c/td>\n\u003ctd>執行 PHP 的標籤邊緣路由器（LER）\u003c/td>\n\u003ctd>PHP 由倒數第二跳 LSR 先 pop 外層標籤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>根據標籤進行轉送\u003c/td>\n\u003ctd>為未標籤封包指派標籤\u003c/td>\n\u003ctd>入口 LER 依 FEC push 標籤後即依標籤轉送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>根據標籤進行轉送\u003c/td>\n\u003ctd>處理多個 VPN 之間的流量\u003c/td>\n\u003ctd>MPLS 核心以標籤承載並隔離多個 L3VPN 客戶\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr>\n\u003cp>\u003ch3>考試常見陷阱\u003c/h3>\u003c/p>\n\u003col>\n\u003cli>LSR（核心 P）只做標籤 swap、不檢視內層 IP；push／pop 是邊緣 LER（PE）的工作。\u003c/li>\n\u003cli>PHP 是「倒數第二跳」彈出，不是出口路由器彈出，目的是省去出口的雙重查表。\u003c/li>\n\u003cli>push＝imposition（加標籤）、pop＝disposition（拆標籤）、swap＝交換標籤，三個動詞與時機不可混淆。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003cp>\u003ch3>網管知識（補充）\u003c/h3>\u003c/p>\n\u003cp>MPLS 標籤位於 L2 與 L3 之間（俗稱 2.5 層），標籤堆疊（label stack）可疊多層：L3VPN 用內層 VPN 標籤＋外層 LDP 傳輸標籤，TE 還可再疊。\u003ccode>show mpls forwarding-table\u003c/code> 可檢視 LFIB 的入/出標籤對應。\u003c/p>\n\u003chr>\n\u003cp>\u003ch3>教學影片連結\u003c/h3>\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.youtube.com/watch?v=DVscaC5Fg7M\" target=\"_blank\" rel=\"noopener noreferrer\">CCNP ENARSI 第39講：MPLS 深入解析（LSR / LDP / LSP / RD vs RT / PHP / 標籤操作）\u003c/a>（CCNP 300-410 對應，建議完整觀看）\u003c/li>\n\u003cli>\u003ca href=\"https://www.youtube.com/watch?v=4JMCBdnCZIE\" target=\"_blank\" rel=\"noopener noreferrer\">MPLS Fundamentals 9.1 #ENARSI (300-410)\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>","source":"BGW 原文（使用者複製的網頁）","imported":"2026-11-04T08:59:42","english":"Drag and drop the operations from the left onto the locations where the operations are performed on the right.","drag":{"type":"drag_category","pairs":[["Label Switch Router","reads the labels and forwards the packet"],["Label Switch Router","performs penultimate hop popping Label Edge Router"],["based on the labels","assigns labels to unlabeled packets"],["based on the labels","handles traffc between multiple VPNS"]]}}},"knowledge":{"version":1,"source":"既有個人化 ENARSI 教材的 71 個主知識點；逐題核對英文題幹","domains":[{"id":"routing","title":"Layer 3｜路由技術"},{"id":"vpn","title":"VPN｜VRF、MPLS 與隧道"},{"id":"security","title":"基礎設施安全"},{"id":"services","title":"基礎設施服務"},{"id":"extra","title":"題庫延伸"}],"units":[{"id":"F01","title":"封包、前綴與最長匹配：先弄懂路由器在找什麼","group":"選路基礎","domain":"routing"},{"id":"F02","title":"AD、metric與備援：為什麼有路卻不走它","group":"選路基礎","domain":"routing"},{"id":"F03","title":"BFD：快速發現故障，不代替路由協定","group":"選路基礎","domain":"routing"},{"id":"F04","title":"RIP、防迴圈與不同路由來源","group":"選 const C=StudyCore,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const app=$('#app'),BASE=()=>({version:2,progress:{},bookmarks:{},uncertain:{},notes:{},history:[],deletedHistory:[],exam:null,current:'A1',examSettings:C.examSettings()});
const freshFilter=()=>({search:'',type:'all',scope:'all',unit:'all',domain:'all',chapter:'all',ids:null});
let bank=window.BANK||{questions:[]},state=BASE(),db=null,view='practice',filter=freshFilter(),drafts={},revealed={},currentResult=null,dragPick='',pendingNote=null,showZh=false,storageOK=true,questionToolsOpen=false;
let reviewFilter={status:'all',unit:'all',chapter:'all'},reviewCurrent=null,knowledgeFilter={domain:'all',sort:'weak',search:''},notesUnit='all';
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3500);}
function status(message){$('#save-state').textContent=message;}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(window.STUDY_STORAGE_KEY||'enarsi-study-room',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function dbGet(key){return new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function dbPut(key,value){return new Promise((resolve,reject)=>{const t=db.transaction('data','readwrite');t.objectStore('data').put(value,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
async function save(){try{if(db)await dbPut('state',JSON.parse(JSON.stringify(state)));else localStorage.setItem((window.STUDY_STORAGE_KEY||'enarsi-study-room')+'-state',JSON.stringify(state));storageOK=true;status('已存於此裝置');}catch{storageOK=false;status('儲存失敗，請匯出備份');toast('儲存空間不足或瀏覽器禁止儲存，請立即匯出備份。');}}
function notes(){return C.mergeNotes(window.BGW_NOTES||{},state.notes||{});}
function note(q){return notes()[q.id];}
function getQ(id){return bank.questions.find(q=>q.id===id);}
function grade(q,a){return C.grade(q,a,note(q));}
function isInteractive(q){return q.type==='choice'||!!note(q)?.drag;}
function typeLabel(q){return {choice:'選擇題',drag:'拖圖題',lab:'LAB 閱讀'}[q.type];}
function chosen(q,exam=false){return exam?(state.exam?.answers[q.id]||(q.type==='choice'?[]:{})):(drafts[q.id]||(q.type==='choice'?[]:{}));}
function noteCount(){return Object.keys(notes()).filter(id=>getQ(id)&&notes()[id].html).length;}
function download(name,object){const blob=new Blob([JSON.stringify(object)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),15000);}
function stamp(){return new Date().toISOString().slice(0,10);}
async function confirmAction(title,body){const d=$('#confirm-dialog');$('#confirm-title').textContent=title;$('#confirm-body').textContent=body;d.returnValue='cancel';return new Promise(resolve=>{d.addEventListener('close',()=>resolve(d.returnValue==='ok'),{once:true});d.showModal();});}
function header(title,sub){const done=Object.keys(state.progress).length;return `<section class="hero"><div><div class="eyebrow">STUDY AT YOUR OWN PACE</div><h1>${title}</h1><p class="muted">${sub}</p></div><div class="stats"><div class="stat"><strong>${bank.questions.length}</strong><span>原題收錄</span></div><div class="stat"><strong>${noteCount()}</strong><span>BGW 中文筆記</span></div><div class="stat"><strong>${done}</strong><span>已練習</span></div></div></section>`;}
function images(q,solution=false,open=false){const list=solution?q.solution:q.images;if(!list?.length)return '';return `<details class="source-images" ${open?'open':''}><summary>${solution?'查看 PDF 原解答':'查看原題與圖表'} · 點圖片可放大</summary>${list.map((src,i)=>`<button class="source-image-btn" data-action="zoom" data-image-index="${i}" data-q="${q.id}" data-solution="${solution}"><img src="${esc(src)}" alt="${q.id} ${solution?'解答':'原題'}圖片 ${i+1}" loading="lazy"></button>`).join('')}</details>`;}
function notePanel(q,open=false){const n=note(q);if(!n?.html)return `<div class="note-box"><p class="small muted">尚未提供本題的 BGW 原文筆記。可在「收集與備份」貼上這題的網頁原始碼。</p></div>`;return `<details class="note-box" ${open?'open':''}><summary>翻閱 BGW 原文筆記</summary><div class="status-row"><span class="badge green">BGW 原文</span><span class="small muted">${esc(n.source)}</span></div><div class="note-content">${C.safeHTML(n.html)}</div></details>`;}
function dragUI(q,answer,locked){const d=note(q)?.drag;if(!d)return `<div class="notice info">這題已保留 PDF 原圖。匯入這題的 BGW 網頁後，即可啟用點選配對；目前可先閱讀與自行核對答案。</div>`;const items=[...new Set(d.pairs.map(p=>p[1]))].sort(),targets=[...new Set(d.pairs.map(p=>p[0]))];return `<p class="small muted">先點選一個選項，再點選右方（手機為下方）的分類。點已放入的項目可移回。</p><div class="drag-layout"><div class="drag-options">${items.map((item,i)=>`<button class="drag-item ${dragPick===item?'active':''} ${answer[item]?'assigned':''}" data-action="drag-pick" data-item="${i}" ${locked?'disabled':''} aria-pressed="${dragPick===item}">${esc(item)}${answer[item]?'<small> ✓ 已放入</small>':''}</button>`).join('')}</div><div class="drag-targets">${targets.map((target,i)=>`<div class="drop-zone ${dragPick?'active':''}" ><h3><button class="drop-title" data-action="drag-place" data-target="${i}" aria-label="放入 ${esc(target)}" ${locked?'disabled':''}>${esc(target)} ＋</button></h3>${items.filter(x=>answer[x]===target).map(item=>`<button data-action="drag-remove" data-item="${items.indexOf(item)}" ${locked?'disabled':''}>${esc(item)} ${locked?'':'×'}</button>`).join('')||'<span class="small muted">點這裡放入</span>'}</div>`).join('')}</div></div>`;}
function questionFigures(q){
 if(q.type!=='choice')return null;
 const original=window.BANK?.questions.find(x=>x.id===q.id);
 if(!original||(q!==original&&!C.sameSourceQuestion(q,original)))return null;
 return Object.hasOwn(QUESTION_FIGURES,q.id)?QUESTION_FIGURES[q.id]:null;
}
function figurePicture(q,f,zoom=false){
 return `<img class="native-figure" src="${esc(f.src)}" alt="${q.id} 題目圖表" width="${f.width}" height="${f.height}" style="width:${Math.min(f.width,zoom?1400:900)}px">`;
}
function figurePanel(q,figures){return figures.length?`<div class="question-figures"><span class="figure-hint">題目圖表 · 點擊可放大</span>${figures.map((f,i)=>`<button class="question-figure" data-action="zoom-figure" data-q="${q.id}" data-figure-index="${i}" aria-label="放大 ${q.id} 圖表 ${i+1}">${figurePicture(q,f)}</button>`).join('')}</div>`:'';}
function question(q,{exam=false,review=false,reviewAnswer=null,reading=false}={}){
 const n=note(q),locked=review||(!exam&&!!revealed[q.id]),answer=review?reviewAnswer:chosen(q,exam),result=locked?grade(q,answer):null;
 let content=`<article class="panel q-card"><div class="q-header"><div class="q-title"><h2>${q.id}</h2><span class="badge">${typeLabel(q)}</span><span class="badge">PDF ${q.pages.join('–').replace(/–.*–/,'–')} 頁</span>${n?.html?'<span class="badge green">有 BGW 中文</span>':''}</div><div class="actions"><button data-action="bookmark" data-id="${q.id}" class="${state.bookmarks[q.id]?'bookmarked':''}" aria-pressed="${!!state.bookmarks[q.id]}">${state.bookmarks[q.id]?'★ 已收藏':'☆ 收藏'}</button>${!exam?`<label><input type="checkbox" id="show-zh" ${showZh?'checked':''}>中文翻譯</label>`:''}</div></div>`;

 const figures=questionFigures(q);

 if(q.type==='choice'){

 for(const id of e.ids){const q=getQ(id),a=e.answers[id],ok=grade(q,a);results[id]=!!ok;if(ok)r.correct++;if(!C.answerComplete(q,a,note(q))){r.unanswered++;r.unansweredIds.push(id);}if(state.uncertain[id])r.flags[id]=true;}
 C.recordExamLearning(state,r,new Set(bank.questions.map(q=>q.id)));state.exam=null;state.history.unshift(r);state.history=state.history.slice(0,40);currentResult=r;reviewCurrent=null;reviewFilter={status:'all',unit:'all',chapter:'all'};view='exam';await save();render();window.scrollTo(0,0);
}
function previewCapture(n){pendingNote=n;$('#capture-preview').innerHTML=`<div class="collection-preview"><span class="badge green">已辨識 ${n.id}</span><p style="margin:12px 0">${esc(n.stemZh||n.english)}</p><div class="status-row"><span class="badge">${n.stemZh?'中文題幹 ✓':'尚無中文題幹'}</span><span class="badge">${n.html?'原文筆記 ✓':'尚無筆記'}</span>${n.drag?'<span class="badge">配對規則 ✓</span>':''}</div><button class="primary" data-action="save-capture">存入這題</button></div>`;}

async function importFiles(files){let imported=0;
 for(const file of files){try{
  if(file.size>200*1024*1024)throw Error('檔案超過 200 MB，請先拆分。');status('正在匯入，請稍候…');const text=await file.text();
  if(/\.json$/i.test(file.name)){
   const data=JSON.parse(text);
   if(data.format==='enarsi-bank'){
    const b=C.validateBank(data.bank);if(bank.questions.length&&!await confirmAction('更換這個裝置的題庫？','原本的學習紀錄會保留；中文筆記會合併。請確認題庫版本相同。'))continue;
    if(!db)throw Error('此瀏覽器無法保存題庫，請使用一般模式的 Safari、Chrome 或 Edge。');
    C.applySourceCorrections(b,window.BANK);await dbPut('bank',b);bank=b;state.notes=C.mergeNotes(state.notes,C.validateNotes(b.notes||{},bank.questions));state.current=bank.questions[0].id;imported+=b.questions.length;view='practice';
   }else if(data.format==='enarsi-notes'){
    if(!bank.questions.length)throw Error('請先匯入完整題庫包，再匯入中文筆記。');const ns=C.validateNotes(data.notes,bank.questions);state.notes=C.mergeNotes(state.notes,ns);imported+=Object.keys(ns).length;
   }else if(data.format==='enarsi-progress'){
    if(!bank.questions.length)throw Error('請先匯入題庫。');if(!await confirmAction('以備份取代這台裝置的進度？','收藏、錯題與歷次測驗會改用備份內容；中文筆記會合併。'))continue;
    const s=data.state;if(!s||typeof s.progress!=='object'||!Array.isArray(s.history))throw Error('備份資料不完整。');const merged=C.mergeNotes(notes(),C.validateNotes(s.notes,bank.questions));
    const known=new Set(bank.questions.map(q=>q.id));const pick=o=>Object.fromEntries(Object.entries(o||{}).filter(([id])=>C.idOK(id)&&known.has(id)));
    state={...BASE(),progress:pick(s.progress),bookmarks:pick(s.bookmarks),uncertain:pick(s.uncertain),notes:merged,examSettings:C.examSettings(s.examSettings),deletedHistory:(Array.isArray(s.deletedHistory)?s.deletedHistory:[]).filter(r=>r&&Array.isArray(r.ids)&&r.ids.length&&r.ids.every(id=>known.has(id))&&r.answers&&r.results),history:s.history.filter(r=>Array.isArray(r.ids)&&r.ids.length&&r.ids.every(id=>known.has(id))&&r.answers&&r.results).slice(0,40),current:known.has(s.current)?s.current:bank.questions[0].id};
    // Imported active exams become a fresh practice state; device clocks and interrupted sessions are not migrated.
    state.masteryVersion=s.masteryVersion;state.masteryEvidence=s.masteryEvidence;for(const key of ['learningLogVersion','learningLog','learningBaseline','learningLegacyBackup','learningMigration','learningResetBackup'])if(s[key]!==undefined)state[key]=s[key];C.initializeLearning(state,known);currentResult=null;drafts={};revealed={};imported++;toast('已還原已完成的紀錄；進行中的測驗不跨裝置接續。');
   }else throw Error('不支援的 JSON 檔案。請使用練習室的題庫包、筆記包或備份檔。');
  }else{
   if(!bank.questions.length)throw Error('請先匯入題庫包。');const n=C.parseBGW(text,bank.questions);state.notes=C.mergeNotes(state.notes,{[n.id]:n});imported++;
  }
 }catch(e){toast(`${file.name}：${e.message}`);}}
 await save();render();if(imported)toast(`匯入完成：${imported} 筆內容`);
}
document.addEventListener('click',async e=>{
 const nav=e.target.closest('[data-view]');if(nav){if(state.exam&&nav.dataset.view!=='exam'){toast('測驗進行中，交卷後再翻閱筆記。');return;}view=nav.dataset.view;currentResult=null;render();window.scrollTo(0,0);return;}

   state.examSettings=C.examSettings(next);await save();render();
  }catch(err){toast(err.message);}return;
 }
 if(action==='toggle-question-tools'){questionToolsOpen=!questionToolsOpen;render();return;}
 if(action==='audit-one'){auditFilter={status:'all',search:b.dataset.id,page:0};view='audit';currentResult=null;render();window.scrollTo(0,0);return;}
 if(action==='audit-page'){auditFilter.page+=Number(b.dataset.step);render();return;}
 if(action==='mastery-details'){masteryFilter.open=!masteryFilter.open;return;}
 if(action==='mastery-filter'){masteryFilter.open=true;masteryFilter.status=b.dataset.status;masteryFilter.page=0;render();$('#mastery-panel').scrollIntoView();return;}
 if(action==='mastery-page'){masteryFilter.page+=Number(b.dataset.step);render();$('#mastery-panel').scrollIntoView();return;}
 if(action==='mastery-exam'){state.examSettings=C.examSettings({...state.examSettings,scope:b.dataset.scope,domain:'all',unit:'all',chapter:'all'});view='exam';currentResult=null;await save();render();window.scrollTo(0,0);return;}
 if(action==='drill-unit'){await startDrill({unit:b.dataset.unit,scope:b.dataset.scope});return;}
 if(action==='clear-filters'){filter=freshFilter();render();return;}
 if(action==='unit-notes'){notesUnit=b.dataset.unit;view='notes';currentResult=null;render();window.scrollTo(0,0);return;}
 if(action==='practice-one'){await startDrill({ids:[b.dataset.id]});return;}
 if(action==='result-drill'){await startDrill({ids:currentResult.ids.filter(id=>!currentResult.results[id])});return;}
 if(action==='review-unit'){reviewFilter={status:'all',unit:b.dataset.unit,chapter:'all'};reviewCurrent=null;render();$('#review-list').scrollIntoView({behavior:'smooth'});return;}
 if(action==='review-list'){$('#review-list').scrollIntoView({behavior:'smooth'});return;}
 if(action==='review-prev'||action==='review-next'){const ids=C.reviewIds(currentResult,bank.questions,bank.knowledge,reviewFilter),at=ids.indexOf(reviewCurrent),next=ids[at+(action==='review-prev'?-1:1)];if(next){renderReviewDetail(next);$('#review-area').scrollIntoView({behavior:'smooth'});}return;}
 if(action==='import'){$('#import-files').click();return;}
 if(action==='bookmark'){state.bookmarks[b.dataset.id]=!state.bookmarks[b.dataset.id];await save();render();return;}
 if(action==='choose'){if(!q||(!exam&&revealed[q.id])||currentResult)return;let a=[...chosen(q,exam)];if(q.answer.length===1)a=[b.dataset.label];else a=a.includes(b.dataset.label)?a.filter(x=>x!==b.dataset.label):[...a,b.dataset.label];if(exam){state.exam.answers[q.id]=a;await save();}else{drafts[q.id]=a;if(a.length===q.answer.length){revealed[q.id]=true;record(q,a,grade(q,a));await save();}}render();return;}
 if(action.startsWith('drag-')){const n=note(q);if(!n?.drag||(!exam&&revealed[q.id])||currentResult)return;const items=[...new Set(n.drag.pairs.map(p=>p[1]))].sort(),targets=[...new Set(n.drag.pairs.map(p=>p[0]))];const answer={...chosen(q,exam)};
  if(action==='drag-pick'){dragPick=items[+b.dataset.item];render();return;}
  if(action==='drag-remove'){delete answer[items[+b.dataset.item]];dragPick='';}
  if(action==='drag-place'){if(!dragPick){toast('先點選左方或上方的一個選項。');return;}answer[dragPick]=targets[+b.dataset.target];dragPick='';}
  if(exam){state.exam.answers[q.id]=answer;await save();}else drafts[q.id]=answer;render();return;
 }
 if(action==='check'){const a=chosen(q);if(q.type==='choice'&&!a.length){toast('請先選擇答案。');return;}if(q.type==='drag'&&Object.keys(a).length!==note(q).drag.pairs.length){toast('請先完成所有配對。');return;}revealed[q.id]=true;record(q,a,grade(q,a));await save();render();return;}
 if(action==='reveal'){revealed[q.id]=true;render();return;}
 if(action==='retry'){delete revealed[q.id];delete drafts[q.id];dragPick='';render();return;}
 if(['prev','next','jump'].includes(action)){const list=exam?state.exam.ids:filtered().map(q=>q.id),i=list.indexOf(state.current);state.current=action==='jump'?b.dataset.id:list[Math.max(0,Math.min(list.length-1,i+(action==='next'?1:-1)))];dragPick='';if(action==='jump')questionToolsOpen=false;await save();render();if(innerWidth<650)document.querySelector('.q-card')?.scrollIntoView({block:'start'});return;}
 if(action==='zoom-figure'){const iq=getQ(b.dataset.q),f=questionFigures(iq)?.[+b.dataset.figureIndex];if(!f)return;$('#image-dialog .zoom-scroll').innerHTML=figurePicture(iq,f,true);$('#image-dialog').showModal();return;}
 if(action==='zoom'){const iq=getQ(b.dataset.q),src=(b.dataset.solution==='true'?iq.solution:iq.images)[+b.dataset.imageIndex];$('#image-dialog .zoom-scroll').innerHTML=`<img src="${esc(src)}" alt="${iq.id} 完整原圖放大檢視">`;$('#image-dialog').showModal();return;}
 if(action==='finish'){await finishExam();return;}
 if(action==='new-exam'){currentResult=null;render();return;}

 if(action==='restore-history'){await restoreHistory();return;}

 if(action==='export-notes'){download(`BGW_中文筆記_${stamp()}.enarsi.json`,{format:'enarsi-notes',version:1,notes:notes()});return;}
 if(action==='export-progress'){download(`ENARSI_學習紀錄_${stamp()}.enarsi.json`,{format:'enarsi-progress',version:1,state:{...state,notes:notes()}});return;}
 if(action==='storage'){let ok=false;try{ok=await navigator.storage?.persist?.();}catch{}toast(ok?'已取得保留儲存空間的許可，仍請保留備份。':'瀏覽器自行管理儲存空間，請保留匯出的備份。');}

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.drop-zone')){e.preventDefault();e.target.click();}});

 if(e.target.closest('#exam-form')){try{const next=readExamForm();if(e.target.id==='exam-domain')next.unit='all';const size=examPool(next).length;if(size&&e.target.id!=='exam-count')next.count=Math.min(next.count,size);state.examSettings=C.examSettings(next);if(!['exam-count','exam-minutes','exam-range-from','exam-range-to'].includes(e.target.id))render();else{if(e.target.id!=='exam-count')$('#exam-count').value=next.count;refreshExamPreview();}await save();}catch(err){toast(err.message);}return;}

 try{const setup=readExamForm(),selectionError=C.examSelectionError(setup);if(selectionError)throw Error(selectionError);const pool=examPool(setup);if(!pool.length)throw Error('這個範圍沒有可測驗的題目。');if(!Number.isInteger(setup.count)||setup.count<1||setup.count>pool.length)throw Error(`題數須介於 1 與 ${pool.length} 之間。`);if(!Number.isInteger(setup.minutes)||setup.minutes<1||setup.minutes>240)throw Error('時間須介於 1 與 240 分鐘。');
  state.examSettings=C.examSettings(setup);const ids=C.selectExamQuestions(pool,setup.count,state,setup,Date.now(),Math.random,bank.knowledge);state.exam={sampling:C.samplingSnapshot(ids,state,setup),ids:ids.map(q=>q.id),answers:{},started:new Date().toISOString(),deadline:Date.now()+setup.minutes*60000,scoring:C.scoring(setup.maxScore,setup.passScore)};state.current=ids[0].id;currentResult=null;resetReview();dragPick='';await save();render();window.scrollTo(0,0);

async function updateOfflineStatus(){const el=$('#offline-status');if(!el)return;if(window.STUDY_SINGLE_FILE||location.protocol==='file:'){el.textContent='離線版：題目與圖片已包含在本機檔案中，不需要網站。手機請用支援互動 HTML 的閱讀器開啟。';return;}if(!('serviceWorker'in navigator)){el.textContent='這個瀏覽器不支援離線快取，請保持網路連線。';return;}try{const r=await navigator.serviceWorker.ready;el.textContent=r.active?'離線介面已準備。外出前請關閉網路，重新開啟一次確認題目和圖片可讀。':'介面正在準備離線使用。';}catch{el.textContent='離線介面尚未準備完成，請保持網路連線。';}}
try{db=await openDB();const [savedBank,savedState]=await Promise.all([dbGet('bank'),dbGet('state')]);if(savedBank)bank=C.validateBank(savedBank);if(savedState)state={...BASE(),...savedState};}catch{try{const saved=localStorage.getItem((window.STUDY_STORAGE_KEY||'enarsi-study-room')+'-state');if(saved)state={...BASE(),...JSON.parse(saved)};}catch{}status('暫存模式，請定期匯出');}

if(!window.STUDY_SINGLE_FILE&&'serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').then(updateOfflineStatus).catch(()=>{if($('#offline-status'))$('#offline-status').textContent='目前無法快取介面，請保持網路連線。';});}
})();
